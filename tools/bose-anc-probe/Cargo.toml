[package]
name = "bose-anc-probe"
version = "0.1.0"
edition = "2021"
description = "Sends a small allowlist of observed Bose vendor frames and verifies the result by read-back."

[[bin]]
name = "bose-anc-probe"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
    "Win32_Devices_Bluetooth",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Properties",
    "Win32_Networking_WinSock",
    "Win32_Foundation",
]

[profile.release]
opt-level = "s"
