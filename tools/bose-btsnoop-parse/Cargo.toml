[package]
name = "bose-btsnoop-parse"
version = "0.1.0"
edition = "2021"
description = "Parses an Android btsnoop HCI log and extracts RFCOMM traffic for a chosen device. Offline; reads a file and writes a report."

[[bin]]
name = "bose-btsnoop-parse"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
