[package]
name = "bose-discovery"
version = "0.1.0"
edition = "2021"
description = "Read-only Bluetooth discovery and reporting for Bose QC Control Center"

[[bin]]
name = "bose-discovery"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting", "macros"] }

[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Properties",
    "Win32_Foundation",
]

[profile.release]
opt-level = "s"
strip = true
